server:
  port: 8080
  servlet:
    context-path: /api
    session:
      cookie:
        path: / 
        same-site: lax
        http-only: true 

spring:
  application:
    name: cartmind-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      max-lifetime: 240000
      keepalive-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      client:
        registration:
          swiggy-mcp:
            client-id: ${SWIGGY_CLIENT_ID}
            client-authentication-method: none
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/swiggy"
            scope: mcp:tools,mcp:resources,mcp:prompts # Requested Swiggy MCP scopes
        provider:
          swiggy-mcp:
            authorization-uri: https://mcp.swiggy.com/auth/authorize
            token-uri: https://mcp.swiggy.com/auth/token

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000 # 24 hours

logging:
  config: classpath:logback.xml


